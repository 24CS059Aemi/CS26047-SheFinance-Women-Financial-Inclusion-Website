<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Tell Us About Yourself</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container onboarding-container">
        <div class="logo">
            <h2 style="font-size: 1.8rem; margin-bottom: 5px;">Welcome to She<span>Finance</span> ✨</h2>
        </div>
        
        <h3 style="margin-bottom: 10px;">Let's Personalize Your Experience</h3>
        <p style="color: var(--text-light); margin-bottom: 30px; font-size: 0.95rem;">Tell us a little bit about yourself so we can help you achieve your financial goals faster.</p>

        <form class="auth-form onboarding-form" action="dashboard.html">
            
            <div class="input-group">
                <label for="occupation">1. What is your current occupation?</label>
                <select id="occupation" class="select-input" required>
                    <option value="" disabled selected>Select occupation...</option>
                    <option value="student">Student</option>
                    <option value="salaried">Salaried Employee</option>
                    <option value="business">Business Owner / Entrepreneur</option>
                    <option value="homemaker">Homemaker</option>
                    <option value="freelancer">Freelancer</option>
                </select>
            </div>

            <div class="input-group">
                <label for="income">2. Average Monthly Income</label>
                <select id="income" class="select-input" required>
                    <option value="" disabled selected>Select income range...</option>
                    <option value="below_10k">Below ₹10,000</option>
                    <option value="10k_30k">₹10,000 - ₹30,000</option>
                    <option value="30k_60k">₹30,000 - ₹60,000</option>
                    <option value="above_60k">Above ₹60,000</option>
                </select>
            </div>

            <div class="input-group">
                <label>3. Experience with Banking & Finance</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="experience" value="beginner" required> 
                        Beginner (Just starting to save)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="experience" value="intermediate"> 
                        Intermediate (Have accounts & basic investments)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="experience" value="advanced"> 
                        Advanced (Actively investing in mutual funds/stocks)
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label for="goal">4. What is your primary financial goal?</label>
                <select id="goal" class="select-input" required>
                    <option value="" disabled selected>Select your main goal...</option>
                    <option value="save_emergency">Build an Emergency Fund</option>
                    <option value="buy_house">Save for a House/Car</option>
                    <option value="start_business">Start a Business</option>
                    <option value="retirement">Invest for the Future / Retirement</option>
                    <option value="clear_debt">Clear Loans/Debt</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 20px; font-size: 1.05rem;">
                Complete Profile & Go to Dashboard <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </form>
    </div>
</body>
</html>
