<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SheFinance</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="logo">
            <a href="index.html">
                <h2>She<span>Finance</span></h2>
            </a>
        </div>

        <h3 style="margin-bottom: 20px;">Welcome Back</h3>
        <p style="color: var(--text-light); margin-bottom: 30px; font-size: 0.9rem;">Sign in to continue to your
            dashboard.</p>

        <form class="auth-form" id="loginForm" onsubmit="handleEmailLogin(event)">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>

            <div class="divider"><span>OR</span></div>

            <!-- Google Identity Services Button -->
            <div id="g_id_onload"
                data-client_id="220990349271-16bitos8lvag5d1thbdhhkt2da0mq5g9.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="center"
                style="display: flex; justify-content: center;">
            </div>
        </form>

        <div class="auth-links">
            <p>Don't have an account? <a href="register.html">Get Started</a></p>
        </div>

        <!-- Google Auth Script -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script>
            // Decode Google JWT payload
            function decodeJWT(token) {
                try {
                    var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    return JSON.parse(atob(base64));
                } catch(e) { return null; }
            }

            // Get registered users from localStorage
            function getUsers() {
                try { return JSON.parse(localStorage.getItem('registeredUsers') || '[]'); } catch(e) { return []; }
            }

            // ---- Email / Password Login ----
            function handleEmailLogin(event) {
                event.preventDefault();
                var email    = document.getElementById('email').value.trim().toLowerCase();
                var password = document.getElementById('password').value;

                var users = getUsers();
                var user  = users.find(function(u) { return u.email === email; });

                if (!user) {
                    alert('No account found with this email.\nPlease register first.');
                    return;
                }
                if (user.provider === 'google') {
                    alert('This account was registered with Google.\nPlease use the "Sign in with Google" button below.');
                    return;
                }
                if (user.password !== password) {
                    alert('Incorrect password. Please try again.');
                    return;
                }

                // Login successful
                sessionStart(user.name, user.email);
            }

            // ---- Google Login (auto-register + login) ----
            async function handleCredentialResponse(response) {
                var payload = decodeJWT(response.credential);
                if (!payload) { alert('Google sign-in failed. Please try again.'); return; }

                var email = payload.email.toLowerCase();
                var name  = payload.name || email.split('@')[0];

                var users = getUsers();
                var user  = users.find(function(u) { return u.email === email; });

                var isNewRegistration = false;
                if (!user) {
                    // Auto-register this Google user
                    users.push({ name: name, email: email, password: null, provider: 'google' });
                    localStorage.setItem('registeredUsers', JSON.stringify(users));
                    // Fresh start
                    localStorage.removeItem('userProfile');
                    localStorage.removeItem('userAvatar');
                    isNewRegistration = true;
                }

                // Call Backend (to trigger Welcome Email only if new)
                try {
                    await fetch('http://localhost:3000/api/google-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            credential: response.credential, 
                            isRegister: isNewRegistration
                        })
                    });
                } catch (err) {
                    console.error("Backend unreachable, but local login successful:", err);
                }

                // Redirect to Onboarding if new, else Dashboard
                if (isNewRegistration) {
                    var prevEmail = localStorage.getItem('userEmail');
                    if (prevEmail && prevEmail !== email) {
                        localStorage.removeItem('userProfile');
                        localStorage.removeItem('userAvatar');
                    }
                    localStorage.setItem('userName',  name);
                    localStorage.setItem('userEmail', email);
                    
                    alert('Registration successful via Google! Welcome to SheFinance.');
                    window.location.href = 'onboarding.html';
                } else {
                    sessionStart(name, email);
                }
            }

            // ---- Start session and go to dashboard ----
            function sessionStart(name, email) {
                var prevEmail = localStorage.getItem('userEmail');
                if (prevEmail && prevEmail !== email) {
                    localStorage.removeItem('userProfile');
                    localStorage.removeItem('userAvatar');
                }
                localStorage.setItem('userName',  name);
                localStorage.setItem('userEmail', email);
                window.location.href = 'dashboard.html';
            }

            function togglePassword(inputId, icon) {
                var input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                } else {
                    input.type = 'password';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                }
            }
        </script>
</body>

</html>
